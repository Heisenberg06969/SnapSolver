<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnapSolver</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #121212; color: #fff; font-family: sans-serif;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            touch-action: manipulation; /* Improves touch responsiveness */
        }
        /* Camera View */
        #camera-view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
        }
        #video-container {
            width: 100%; height: 100%; position: relative; overflow: hidden;
        }
        video {
            width: 100%; height: 100%; object-fit: cover;
        }
        
        /* Chat View */
        #chat-view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e1e1e; display: none; flex-direction: column;
            z-index: 20;
        }
        #answer-container {
            flex-grow: 1; padding: 20px; overflow-y: auto;
        }
        #answer-text {
            font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap;
        }
        
        /* Floating Elements */
        .instruction-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px;
            font-size: 1rem; pointer-events: none; z-index: 10;
            color: rgba(255,255,255,0.8);
            text-align: center; white-space: nowrap;
        }
        
        #btn-history {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.15); color: white; 
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px;
            padding: 8px 16px; font-size: 0.9rem; font-weight: bold;
            cursor: pointer; backdrop-filter: blur(5px); z-index: 30;
            display: none;
        }
        #btn-history:active { background: rgba(255, 255, 255, 0.25); }

        #subject-bar {
            position: absolute; top: 15px; left: 15px; right: 130px;
            display: flex; gap: 8px; overflow-x: auto; z-index: 30;
            padding-bottom: 5px;
            scrollbar-width: none; /* Firefox */
        }
        #subject-bar::-webkit-scrollbar { display: none; } /* Chrome */
        
        .subject-pill {
            background: rgba(0, 0, 0, 0.6); color: white;
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 15px;
            padding: 8px 14px; font-size: 0.85rem; cursor: pointer;
            white-space: nowrap; backdrop-filter: blur(5px);
        }
        .subject-pill.active {
            background: rgba(76, 175, 80, 0.8);
            border-color: #4CAF50;
        }
        
        #btn-refresh {
            position: absolute; top: 60px; right: 20px;
            background: rgba(255, 255, 255, 0.15); color: white; 
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px;
            padding: 8px 16px; font-size: 0.8rem; font-weight: bold;
            cursor: pointer; backdrop-filter: blur(5px); z-index: 30;
        }
        #btn-refresh:active { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body>

    <!-- Camera View -->
    <div id="camera-view">
        
        <div id="video-container">
            <video id="video" autoplay playsinline></video>
            <div class="instruction-overlay">Double-tap to solve</div>
        </div>
        <button id="btn-history" onclick="showChat(event)">Last Answer</button>
    </div>

    <!-- Chat View -->
    <div id="chat-view">
        <div id="answer-container">
            <div id="answer-text"></div>
        </div>
        <div class="instruction-overlay">Double-tap to return to camera</div>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const chatView = document.getElementById('chat-view');
        const cameraView = document.getElementById('camera-view');
        const answerText = document.getElementById('answer-text');
        const btnHistory = document.getElementById('btn-history');
        const videoContainer = document.getElementById('video-container');
        
        let stream = null;
        let isChatMode = false;
        let lastFullText = "";
        let activeSubjects = new Set();

        async function initCamera() {
            try {
                if (!stream) {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" } 
                    });
                    video.srcObject = stream;
                }
            } catch (err) {
                alert('Camera Error. Check permissions.');
            }
        }

        async function loadSubjects() {
            try {
                const res = await fetch('/subjects');
                const data = await res.json();
                const bar = document.getElementById('subject-bar');
                bar.innerHTML = '';
                data.subjects.forEach(sub => {
                    const pill = document.createElement('div');
                    pill.className = 'subject-pill';
                    pill.innerText = sub;
                    pill.onclick = (e) => {
                        e.stopPropagation();
                        if(activeSubjects.has(sub)) {
                            activeSubjects.delete(sub);
                            pill.classList.remove('active');
                        } else {
                            activeSubjects.add(sub);
                            pill.classList.add('active');
                        }
                    };
                    bar.appendChild(pill);
                });
            } catch (err) {
                console.error("Failed to load subjects", err);
            }
        }

        async function refreshIndex(e) {
            if(e) e.stopPropagation();
            const btn = document.getElementById('btn-refresh');
            btn.innerText = "Syncing...";
            try {
                const res = await fetch('/refresh-index', {method: 'POST'});
                const data = await res.json();
                if(data.status === "success") {
                    alert(`Synced ${data.chunks_indexed} syllabus chunks successfully!`);
                } else {
                    alert(data.status);
                }
            } catch(err) {
                alert("Failed to sync: " + err.message);
            }
            btn.innerText = "Sync Syllabus";
        }

        function showCamera() {
            isChatMode = false;
            chatView.style.display = 'none';
            cameraView.style.display = 'flex';
            if (lastFullText !== "") {
                btnHistory.style.display = 'block';
            }
        }

        function showChat(e) {
            if (e) e.stopPropagation(); // Prevent double tap triggering
            isChatMode = true;
            cameraView.style.display = 'none';
            chatView.style.display = 'flex';
        }

        async function captureAndSend() {
            if (isChatMode) return; 
            
            // Capture Image
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            const base64Image = dataUrl.split(',')[1];
            
            showChat();
            answerText.innerText = "Analyzing image...";
            if (activeSubjects.size > 0) {
                answerText.innerText += `\nSearching context in: ${Array.from(activeSubjects).join(', ')}...`;
            }
            lastFullText = ""; 
            
            try {
                const response = await fetch('/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        image: base64Image,
                        
                    })
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = "";
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    fullText += decoder.decode(value, { stream: true });
                    lastFullText = fullText;
                    
                    let displayText = fullText;
                    if (displayText.includes("<think>")) {
                        if (displayText.includes("</think>")) {
                            displayText = displayText.split("</think>")[1].trim();
                        } else {
                            displayText = "Reasoning...";
                        }
                    }
                    
                    answerText.innerText = displayText;
                }
            } catch (err) {
                answerText.innerText = "Error: " + err.message;
            }
        }

        // --- Custom Double Tap Logic for Mobile ---
        let lastTapTime = 0;
        
        function handleDoubleTap(e, callback) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            if (tapLength < 400 && tapLength > 0) {
                callback();
                e.preventDefault(); // Prevent zoom
            }
            lastTapTime = currentTime;
        }

        // Add touch listeners
        videoContainer.addEventListener('touchstart', (e) => {
            handleDoubleTap(e, captureAndSend);
        });
        
        chatView.addEventListener('touchstart', (e) => {
            // Only trigger back if they double-tap the background, not while scrolling
            handleDoubleTap(e, showCamera);
        });

        // Allow physical volume keys
        window.addEventListener('keydown', (e) => {
            if (e.key === 'VolumeUp' || e.key === 'ArrowUp') {
                showCamera();
            } else if (e.key === 'VolumeDown' || e.key === 'ArrowDown') {
                captureAndSend();
            }
        });

        initCamera();
        
    </script>
</body>
</html>
